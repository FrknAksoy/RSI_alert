name: Bybit Futures Structure Telegram Alert

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: futures-structure-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Önceki futures sinyallerini geri yükle
        uses: actions/cache/restore@v4
        with:
          path: futures_state.json
          key: futures-state-${{ github.run_id }}
          restore-keys: futures-state-

      - name: Kapalı 4s mumlarını tara ve saatlik Telegram özeti gönder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python futures_structure_alert.py

      - name: Futures sinyal durumunu sakla
        if: success()
        uses: actions/cache/save@v4
        with:
          path: futures_state.json
          key: futures-state-${{ github.run_id }}
