name: RSI Telegram Alert

on:
  schedule:
   - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sinyal kaydını geri yükle
        uses: actions/cache/restore@v4
        with:
          path: rsi_state.json
          key: rsi-state-${{ github.run_id }}
          restore-keys: rsi-state-

      - name: Tara ve bildir
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_telegram_alert.py

      - name: Sinyal kaydını sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: rsi_state.json
          key: rsi-state-${{ github.run_id }}
